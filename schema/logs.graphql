type RoyaltiesUpdateLog {
  id: ID! # chainid + transactionHash + logIndex
  chainid: Int!
  transactionHash: String!
  logIndex: Int!
  # collection or token
  collection: Collection
  token: Token
  # event data
  sender: Wallet!
  tokenId: BigInt!
  royaltyPc: BigInt
  royaltyReceiver: Wallet!
  # timestamps
  blockNumber: Int!
  blockTimestamp: Int!
}
